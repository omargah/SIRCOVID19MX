[pytest]
# Une la configuración de fervent-dirac (teoría) y de kind-newton (F4/sirmx).
# pythonpath = . : para que sirmx y src se importen desde la raíz.
# --strict-markers: un marcador mal escrito (p. ej. "teroia") es error, no
# un test que se salta en silencio. -ra: resumen de xfail/skips al final.
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers
markers =
    teoria: verificación simbólica (SymPy) + numérica (src/sir.py) de las derivaciones del Cap. 2 (tests/teoria/)
